<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B11">
<title>ZClip is offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080B11; color: #F4F7FB;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  main { max-width: 22rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: #9AA8BA; line-height: 1.5; margin: 0 0 1.25rem; }
  button { background: #39D7F2; color: #080B11; border: 0; border-radius: .75rem; padding: .8rem 1.4rem; font-size: 1rem; font-weight: 600; min-height: 44px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #F4F7FB; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>ZClip needs a connection to upload, edit and download videos. Your projects are safe. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
